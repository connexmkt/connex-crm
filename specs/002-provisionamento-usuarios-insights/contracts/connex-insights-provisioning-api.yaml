openapi: 3.1.0
info:
  title: Connex CRM — Provisionamento de Usuários do Connex Insights
  version: 1.0.0
  description: |
    Endpoints para qualquer usuário autenticado do CRM (sem restrição de papel) no hub
    /aplicacoes/connex-insights: indicadores agregados, listagem de tenants/usuários e
    criação de novos acessos. Toda comunicação com o Connex Insights ocorre em contexto
    de servidor (Service Role); nenhuma credencial do Insights é exposta ao cliente.

servers:
  - url: /api/aplicacoes/connex-insights
    description: Next.js Route Handlers (connex-crm)

paths:
  /dashboard:
    get:
      operationId: getConnexInsightsDashboard
      summary: Obter contadores agregados (usuários e tenants) do Connex Insights
      tags: [ConnexInsights]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Contadores obtidos com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Connex Insights indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tenants:
    get:
      operationId: listConnexInsightsTenants
      summary: Listar tenants existentes no Connex Insights (para o seletor do formulário)
      tags: [ConnexInsights]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Connex Insights indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios:
    get:
      operationId: listConnexInsightsUsers
      summary: Listar usuários provisionados no Connex Insights (para a tabela da tela)
      tags: [ConnexInsights]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Connex Insights indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createConnexInsightsUser
      summary: Provisionar um novo usuário/acesso no Connex Insights
      tags: [ConnexInsights]
      security:
        - cookieAuth: []
      description: |
        Cria o usuário no Supabase Auth do Connex Insights (status INACTIVE) e o
        registro correspondente em `profiles`, associado a exatamente um tenant.
        Retorna a senha temporária uma única vez — ela nunca é persistida em texto
        plano nem pode ser recuperada por uma nova chamada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado com sucesso; senha temporária incluída uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSuccessResponse'
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Tenant informado não existe no Connex Insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail ou login já em uso no Connex Insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha de comunicação com o Connex Insights durante a criação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: Sessão Supabase do connex-crm (cookie httpOnly via @supabase/ssr); qualquer usuário autenticado, sem restrição de papel.

  responses:
    Unauthorized:
      description: Sem sessão autenticada no CRM
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    ValidationErrorResponse:
      type: object
      properties:
        error: { type: string }
        details: { type: object }
      required: [error]

    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            totalUsers: { type: integer, minimum: 0 }
            totalTenants: { type: integer, minimum: 0 }
          required: [totalUsers, totalTenants]
      required: [data]

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      required: [id, name]

    TenantListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
      required: [data]

    ConnexInsightsUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        login: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
        tenant: { $ref: '#/components/schemas/Tenant' }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, login, status, tenant, createdAt]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConnexInsightsUser' }
        meta:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
          required: [page, pageSize, total]
      required: [data, meta]

    CreateUserRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        login:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-z0-9._-]+$'
        tenantId: { type: string, format: uuid }
      required: [name, email, login, tenantId]

    CreateUserSuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            login: { type: string }
            tenant: { $ref: '#/components/schemas/Tenant' }
            status: { type: string, enum: [INACTIVE] }
            temporaryPassword:
              type: string
              description: Exibida somente nesta resposta; não recuperável posteriormente.
          required: [id, name, email, login, tenant, status, temporaryPassword]
      required: [data]
